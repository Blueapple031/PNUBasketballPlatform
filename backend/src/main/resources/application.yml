# 메인 설정 파일
# application-secret.yml은 spring.profiles.include로 로드됩니다.
# application-secret.yml에는 jwt.secret, DB 비밀번호 등 민감 정보를 두세요.
#
# 기본값: local 프로파일 (Redis 없이 인메모리 토큰 저장)
# 운영 배포 시: --spring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod

spring:
  profiles:
    active: local
    include: secret

# JWT 토큰 만료 시간 (민감하지 않은 값 - application-secret.yml에 jwt.secret 필요)
jwt:
  access-token-expiration: 3600000    # 1시간 (밀리초)
  refresh-token-expiration: 604800000  # 7일 (밀리초)
