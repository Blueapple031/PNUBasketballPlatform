plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.pnu'
version = '0.0.1-SNAPSHOT'
archivesBaseName = 'PNUBasketballPlatform'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    
    // Database
    runtimeOnly 'org.postgresql:postgresql'
    // PostgreSQL 17 support starts in Flyway 10.20. Keep core and the
    // database-specific module on the same explicitly reviewed version.
    implementation 'org.flywaydb:flyway-core:10.20.1'
    implementation 'org.flywaydb:flyway-database-postgresql:10.20.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // API Documentation (Swagger)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // OAuth2 Client (구글 로그인)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    
    // Google API Client (ID Token 검증)
    implementation 'com.google.api-client:google-api-client:2.2.0'
    
    // Firebase Admin SDK (FCM 푸시 알림)
    implementation 'com.google.firebase:firebase-admin:9.2.0'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// bootJar만 사용하므로 plain jar(-plain.jar)는 생성하지 않음 (Docker COPY 시 파일 하나만 매칭되도록)
tasks.named('jar') {
    enabled = false
}

// 로컬 개발용 application-secret.yml(RDS 등 실제 접속 정보)은 배포용 jar에 절대 포함하지 않음.
// 운영/도커 환경은 서버의 config/application-secret.yml(외부 마운트)만 사용해야 함.
// bootRun은 src/main/resources를 classpath로 직접 읽으므로 로컬 개발에는 영향 없음.
tasks.named('bootJar') {
    exclude 'application-secret.yml'
}

